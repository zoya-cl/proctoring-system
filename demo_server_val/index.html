<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ProctorGuard — Server-Side Validation Demo</title>
<style>
  :root { --bg: #0a0c10; --panel: #0f1318; --border: #1e2530; --accent: #00e5ff; --text: #cdd6e0; --danger: #ff3d5a; --ok: #00e676; --warn: #ffb300; }
  body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; }
  main { width: 90%; margin: 0 auto; display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
  .cam-wrap { position: relative; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; }
  #videoEl, #overlayCanvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; }
  .stat-box { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
  .stat-num { font-size: 1.5rem; font-weight: 800; font-family: monospace; }
  .sidebar { display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .check-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 8px; }
  .check-sub { font-size: 0.7rem; color: #888; }
  #violLog { display: flex; flex-direction: row; overflow-x: auto; gap: 12px; padding: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; min-height: 180px; margin-top: 20px; }
  .log-entry { flex: 0 0 160px; font-size: 0.65rem; padding: 8px; background: #1a1e24; border: 1px solid #333; border-radius: 6px; }
  .btn { width: 100%; padding: 15px; background: var(--accent); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div class="left-col">
    <div class="cam-wrap"><video id="videoEl" autoplay muted playsinline></video><canvas id="overlayCanvas"></canvas></div>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-num" id="statFaces">0</div><div>FACES</div></div>
      <div class="stat-box"><div class="stat-num" id="statViol">0</div><div>VIOLATIONS</div></div>
      <div class="stat-box"><div class="stat-num" id="statTime">0s</div><div>ELAPSED</div></div>
    </div>
    <div id="violLog"></div>
  </div>
  <div class="sidebar">
    <div class="card"><button class="btn" id="startBtn">▶ START MONITORING</button></div>
    <div class="card">
        <div class="check-item" id="ck-face"><div class="check-sub" id="ck-face-sub">Face: Waiting…</div></div>
        <div class="check-item" id="ck-multi"><div class="check-sub" id="ck-multi-sub">Person: Waiting…</div></div>
        <div class="check-item" id="ck-frame"><div class="check-sub" id="ck-frame-sub">In Frame: Waiting…</div></div>
        <div class="check-item" id="ck-gaze"><div class="check-sub" id="ck-gaze-sub">Gaze: Waiting…</div></div>
        <div class="check-item" id="ck-phone"><div class="check-sub" id="ck-phone-sub">Phone: Waiting…</div></div>
    </div>
  </div>
</main>
<script type="module">
  import { ProctorKit } from '../sdk/ProctorKit.js';

  const proctor = new ProctorKit({
    apiBase: 'http://localhost:8000',
    examSessionId: 'demo_session_001',
    onDetection: (d) => {
        document.getElementById("statFaces").textContent = d.faces;
        document.getElementById("statViol").textContent = d.violations;
        document.getElementById("statTime").textContent = d.elapsed;
        updateCheck("ck-face", d.checks.face ? "ok" : "danger", d.checks.face ? "Face: Detected" : "Face: Missing");
        updateCheck("ck-phone", d.checks.phone ? "ok" : "danger", d.checks.phone ? "Phone: Clear" : "Phone: Detected!");
        updateCheck("ck-multi", d.checks.multi ? "ok" : "warn", d.checks.multi ? "Person: Clear" : "Person: Multiple!");
        updateCheck("ck-gaze", d.checks.gaze ? "ok" : "warn", d.checks.gaze ? "Gaze: Forward" : "Gaze: Away");
        updateCheck("ck-frame", d.checks.frame ? "ok" : "danger", d.checks.frame ? "Centered" : "Off-Center");
    },
    onViolation: (data) => {
        const log = document.getElementById("violLog");
        const entry = document.createElement("div");
        entry.className = "log-entry danger";
        entry.innerHTML = `<strong>${data.msg}</strong><br/><small>${new Date().toLocaleTimeString()}</small>`;
        log.prepend(entry);
    }
  });

  function updateCheck(id, state, sub) {
    const el = document.getElementById(id);
    if (el) { el.className = "check-item " + state; el.querySelector(".check-sub").textContent = sub; }
  }

  // No drawing logic
  proctor.onDraw = (ctx, faces, phones, w, h) => { ctx.clearRect(0,0,w,h); };

  document.getElementById('startBtn').addEventListener('click', async () => {
    await proctor.init();
    const v = document.getElementById("videoEl");
    v.srcObject = await navigator.mediaDevices.getUserMedia({video: true});
    proctor.start(v, (d) => {});
  });
</script>
</body>
</html>
