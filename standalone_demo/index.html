<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ProctorGuard — SDK Demo</title>
<style>
  :root { --bg: #0a0c10; --panel: #0f1318; --accent: #00e5ff; --text: #cdd6e0; --danger: #ff3d5a; }
  body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; }
  main { width: 80%; margin: 0 auto; display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
  .cam-wrap { position: relative; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; }
  #videoEl, #overlayCanvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .card { background: var(--panel); padding: 18px; border-radius: 10px; border: 1px solid #1e2530; }
  .btn { width: 100%; padding: 13px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; background: var(--accent); }
  #violLog { display: flex; gap: 10px; overflow-x: auto; padding: 10px; margin-top: 20px; background: var(--panel); }
  .log-entry { flex: 0 0 140px; font-size: 0.7rem; border: 1px solid #333; padding: 5px; border-radius: 5px; }
  .log-entry img { width: 100%; }
</style>
</head>
<body>
<main>
  <div class="left-col">
    <div class="cam-wrap">
      <video id="videoEl" autoplay muted playsinline></video>
      <canvas id="overlayCanvas"></canvas>
    </div>
    <div id="violLog"></div>
  </div>
  <div class="sidebar">
    <div class="card">
      <button class="btn" id="startBtn">START MONITORING</button>
    </div>
  </div>
</main>
<script type="module">
  import { ProctorKit } from '../sdk/ProctorKit.js';

  const proctor = new ProctorKit({
    apiBase: 'http://localhost:8000',
    examSessionId: 'demo_session_001',
    onViolation: (data) => {
        const log = document.getElementById("violLog");
        const d = document.createElement("div");
        d.className = "log-entry";
        d.innerHTML = `<strong>${data.msg}</strong><br/><small>${new Date().toLocaleTimeString()}</small>`;
        log.prepend(d);
    }
  });

  document.getElementById('startBtn').addEventListener('click', async () => {
    await proctor.init();
    const v = document.getElementById("videoEl");
    v.srcObject = await navigator.mediaDevices.getUserMedia({video: true});
    proctor.start(v, document.getElementById("overlayCanvas"));
  });
</script>
</body>
</html>
